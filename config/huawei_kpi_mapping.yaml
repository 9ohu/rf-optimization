# Huawei (U2020 / PRS / MBB) KPI + counter name -> canonical schema mapping.
#
# Keys are canonical names (see rfopt/ingest/schema.py). Values are alias lists.
# Matching is case / unit / punctuation insensitive (see mapping.normalise_name),
# so "E-RAB Setup Success Rate (%)", "E RAB SETUP SUCCESS RATE" and
# "erab_setup_success_ratio" all resolve to the same alias.
#
# Add your operator's exact column headers here once and every future upload
# maps automatically. Unmapped columns are still surfaced in the UI for manual
# mapping.

